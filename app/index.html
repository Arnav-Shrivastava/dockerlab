<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        /* Glassmorphism CSS */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #1e0533 0%, #110a2a 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Abstract shapes for background */
        .shape {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
        }
        .shape.one {
            width: 400px; height: 400px;
            background: #ff2a5f;
            top: -100px; left: -100px;
            border-radius: 50%;
        }
        .shape.two {
            width: 500px; height: 500px;
            background: #4a00e0;
            bottom: -150px; right: -100px;
            border-radius: 50%;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 380px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
        }

        h1 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ff8a00, #e52e71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            display: block;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .info-group {
            margin-bottom: 20px;
        }

        .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            display: block;
        }

        .value {
            font-size: 18px;
            font-weight: 400;
            margin: 0;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-family: inherit;
            font-size: 16px;
            padding: 10px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s ease;
        }
        
        input:focus {
            border-color: #ff2a5f;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff2a5f 0%, #ff5e3a 100%);
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: opacity 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.4);
        }

        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.98);
        }

        #container-edit {
            display: none;
        }
    </style>
</head>
<body>
    <div class="shape one"></div>
    <div class="shape two"></div>

    <!-- View Mode -->
    <div class="glass-card" id="container">
        <h1>User Profile</h1>
        <img src="profile-picture" alt="User Profile" class="profile-img" onerror="this.src='https://ui-avatars.com/api/?name=Anna+Smith&background=random'">
        
        <div class="info-group">
            <span class="label">Name</span>
            <p class="value" id="name">Anna Smith</p>
        </div>
        <div class="info-group">
            <span class="label">Email</span>
            <p class="value" id="email">anna.smith@example.com</p>
        </div>
        <div class="info-group">
            <span class="label">Interests</span>
            <p class="value" id="interests">Coding, Docker, Architecture</p>
        </div>
        
        <button class="btn" onclick="updateProfile()">Edit Profile</button>
    </div>

    <!-- Edit Mode -->
    <div class="glass-card" id="container-edit">
        <h1>Edit Profile</h1>
        
        <div class="info-group">
            <span class="label">Name</span>
            <input type="text" id="input-name" value="Anna Smith" />
        </div>
        <div class="info-group">
            <span class="label">Email</span>
            <input type="email" id="input-email" value="anna.smith@example.com" />
        </div>
        <div class="info-group">
            <span class="label">Interests</span>
            <input type="text" id="input-interests" value="Coding, Docker, Architecture" />
        </div>
        
        <button class="btn" onclick="handleUpdateProfileRequest()">Save Changes</button>
    </div>

    <script>
        (async function init() {
            try {
                const response = await fetch('/get-profile');
                if (response.ok) {
                    const user = await response.json();
                    if (user && Object.keys(user).length > 0) {
                        document.getElementById('name').textContent = user.name || 'Anna Smith';
                        document.getElementById('email').textContent = user.email || 'anna.smith@example.com';
                        document.getElementById('interests').textContent = user.interests || 'Coding, Docker, Architecture';
                    }
                }
            } catch (e) {
                console.log("Could not fetch profile, using defaults.");
            }
        })();

        async function handleUpdateProfileRequest() {
            const payload = {
                name: document.getElementById('input-name').value, 
                email: document.getElementById('input-email').value, 
                interests: document.getElementById('input-interests').value
            };
            
            try {
                const response = await fetch('/update-profile', {
                    method: "POST",
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                const jsonResponse = await response.json();

                document.getElementById('name').textContent = jsonResponse.name;
                document.getElementById('email').textContent = jsonResponse.email;
                document.getElementById('interests').textContent = jsonResponse.interests;
            } catch (e) {
                console.log("Error updating profile", e);
                // Fallback UI update if backend is not saving
                document.getElementById('name').textContent = payload.name;
                document.getElementById('email').textContent = payload.email;
                document.getElementById('interests').textContent = payload.interests;
            }

            document.getElementById('container').style.display = 'block';
            document.getElementById('container-edit').style.display = 'none';
        }

        function updateProfile() {
            document.getElementById('input-name').value = document.getElementById('name').textContent;
            document.getElementById('input-email').value = document.getElementById('email').textContent;
            document.getElementById('input-interests').value = document.getElementById('interests').textContent;

            document.getElementById('container').style.display = 'none';
            document.getElementById('container-edit').style.display = 'block';
        }
    </script>
</body>
</html>
